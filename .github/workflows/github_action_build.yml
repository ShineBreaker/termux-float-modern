name: GitHub Action Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: "15 0 1 */2 *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Build
        shell: bash {0}
        env:
          # Signing inputs for the emacs variant: either a base64 encoded keystore
          # in the EMACS_KEYSTORE_BASE64 secret, or a download URL in the
          # EMACS_KEYSTORE_URL repository variable. Neither is needed for the
          # github variant, which is signed with the bundled test key.
          EMACS_KEYSTORE_BASE64: ${{ secrets.EMACS_KEYSTORE_BASE64 }}
          EMACS_KEYSTORE_URL: ${{ vars.EMACS_KEYSTORE_URL }}
        run: |
          exit_on_error() { echo "$1"; exit 1; }

          echo "Setting vars"

          if [ "$GITHUB_EVENT_NAME" == "pull_request" ]; then
              GITHUB_SHA="${{ github.event.pull_request.head.sha }}" # Do not use last merge commit set in GITHUB_SHA
          fi

          # Set RELEASE_VERSION_NAME to "<CURRENT_VERSION_NAME>+<last_commit_hash>"
          CURRENT_VERSION_NAME_REGEX='\s+versionName "([^"]+)"$'
          CURRENT_VERSION_NAME="$(grep -m 1 -E "$CURRENT_VERSION_NAME_REGEX" ./app/build.gradle | sed -r "s/$CURRENT_VERSION_NAME_REGEX/\1/")"
          RELEASE_VERSION_NAME="v$CURRENT_VERSION_NAME+${GITHUB_SHA:0:7}" # The "+" is necessary so that versioning precedence is not affected
          if ! printf "%s" "${RELEASE_VERSION_NAME/v/}" | grep -qP '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$'; then
            exit_on_error "The release version '${RELEASE_VERSION_NAME/v/}' generated from current version '$CURRENT_VERSION_NAME' is not a valid version as per semantic version '2.0.0' spec in the format 'major.minor.patch(-prerelease)(+buildmetadata)'. https://semver.org/spec/v2.0.0.html."
          fi

          APK_DIR_PATH="./app/build/outputs/apk/release"
          # Gradlew wipes the variant output dir on every build, so APKs are staged
          # out of it between the two signing builds.
          DIST_DIR_PATH="./dist"
          APK_VERSION_TAG="$RELEASE_VERSION_NAME.github.release" # Note the ".", GITHUB_SHA will already have "+" before it
          EMACS_APK_VERSION_TAG="$RELEASE_VERSION_NAME.emacs.release"

          # Used by upload step later
          echo "RELEASE_VERSION_NAME=$RELEASE_VERSION_NAME" >> $GITHUB_ENV
          echo "DIST_DIR_PATH=$DIST_DIR_PATH" >> $GITHUB_ENV
          echo "APK_VERSION_TAG=$APK_VERSION_TAG" >> $GITHUB_ENV
          echo "EMACS_APK_VERSION_TAG=$EMACS_APK_VERSION_TAG" >> $GITHUB_ENV
          mkdir -p "$DIST_DIR_PATH"

          export TERMUX_FLOAT_APP__BUILD__APP_VERSION_NAME="${RELEASE_VERSION_NAME/v/}" # Used by app/build.gradle

          # Variant 1: github distribution, signed with the bundled test key.
          # Works with Termux installs that share that signature (e.g. upstream
          # GitHub builds); installable next to any Termux only when signatures match.
          rm -f local.properties
          export TERMUX_FLOAT_APP__BUILD__APK_VERSION_TAG="$APK_VERSION_TAG" # Used by app/build.gradle
          echo "Building APK file for '$RELEASE_VERSION_NAME' with '$APK_VERSION_TAG' tag"
          if ! ./gradlew assembleRelease; then
            exit_on_error "Build failed for '$RELEASE_VERSION_NAME' release with '$APK_VERSION_TAG' tag."
          fi
          mv "$APK_DIR_PATH/termux-float-app_$APK_VERSION_TAG.apk" "$DIST_DIR_PATH/"

          # Variant 2: signed with the GNU Emacs build key shared with the re-signed
          # Termux app, which is what android:sharedUserId="com.termux" requires for
          # session sharing on that install.
          EMACS_KEYSTORE_FILE="$RUNNER_TEMP/emacs.keystore"
          if [ -n "$EMACS_KEYSTORE_BASE64" ]; then
              echo "$EMACS_KEYSTORE_BASE64" | base64 -d > "$EMACS_KEYSTORE_FILE"
          elif [ -n "$EMACS_KEYSTORE_URL" ]; then
              curl -fsSL --connect-timeout 15 -o "$EMACS_KEYSTORE_FILE" "$EMACS_KEYSTORE_URL"
          fi

          if [ -s "$EMACS_KEYSTORE_FILE" ]; then
              printf 'sdk.dir=%s\nemacs.keystore.path=%s\n' "$ANDROID_HOME" "$EMACS_KEYSTORE_FILE" > local.properties
              export TERMUX_FLOAT_APP__BUILD__APK_VERSION_TAG="$EMACS_APK_VERSION_TAG"
              echo "Building APK file for '$RELEASE_VERSION_NAME' with '$EMACS_APK_VERSION_TAG' tag"
              if ! ./gradlew assembleRelease; then
                rm -f local.properties
                exit_on_error "Build failed for '$RELEASE_VERSION_NAME' release with '$EMACS_APK_VERSION_TAG' tag."
              fi
              mv "$APK_DIR_PATH/termux-float-app_$EMACS_APK_VERSION_TAG.apk" "$DIST_DIR_PATH/"
              rm -f local.properties
          else
              echo "::warning::No emacs keystore available (set the EMACS_KEYSTORE_BASE64 secret or EMACS_KEYSTORE_URL repository variable); skipping the emacs-signed build"
          fi

          unset TERMUX_FLOAT_APP__BUILD__APP_VERSION_NAME
          unset TERMUX_FLOAT_APP__BUILD__APK_VERSION_TAG

          echo "Validating APK files"
          if ! test -f "$DIST_DIR_PATH/termux-float-app_$APK_VERSION_TAG.apk"; then
            files_found="$(ls "$DIST_DIR_PATH")"
            exit_on_error "Failed to find built APK file at '$DIST_DIR_PATH/termux-float-app_$APK_VERSION_TAG.apk'. Files found: "$'\n'"$files_found"
          fi
          if [ -s "$EMACS_KEYSTORE_FILE" ] && ! test -f "$DIST_DIR_PATH/termux-float-app_$EMACS_APK_VERSION_TAG.apk"; then
            files_found="$(ls "$DIST_DIR_PATH")"
            exit_on_error "Failed to find built APK file at '$DIST_DIR_PATH/termux-float-app_$EMACS_APK_VERSION_TAG.apk'. Files found: "$'\n'"$files_found"
          fi

          echo "Generating checksums-sha256.txt file"
          APK_FILES="termux-float-app_$APK_VERSION_TAG.apk"
          if [ -f "$DIST_DIR_PATH/termux-float-app_$EMACS_APK_VERSION_TAG.apk" ]; then
            APK_FILES="$APK_FILES termux-float-app_$EMACS_APK_VERSION_TAG.apk"
          fi
          if ! (cd "$DIST_DIR_PATH"; sha256sum $APK_FILES > checksums-sha256.txt); then
            exit_on_error "Generate checksums-sha256.txt file failed for '$RELEASE_VERSION_NAME' release."
          fi
          echo "checksums-sha256.txt:"$'\n```\n'"$(cat "$DIST_DIR_PATH/checksums-sha256.txt")"$'\n```'

      - name: Upload files to action
        uses: actions/upload-artifact@v4
        with:
          name: termux-float-app_${{ env.RELEASE_VERSION_NAME }}
          path: |
            ${{ env.DIST_DIR_PATH }}/termux-float-app_${{ env.APK_VERSION_TAG }}.apk
            ${{ env.DIST_DIR_PATH }}/termux-float-app_${{ env.EMACS_APK_VERSION_TAG }}.apk
            ${{ env.DIST_DIR_PATH }}/checksums-sha256.txt
